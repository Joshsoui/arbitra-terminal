services:
  - type: web
    name: arbitra-terminal
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BOL_CLIENT_ID
        sync: false
      - key: BOL_CLIENT_SECRET
        sync: false
      - key: AMAZON_CREATORS_API_ENDPOINT
        sync: false
      - key: AMAZON_CREATORS_API_TOKEN
        sync: false
      - key: META_AD_LIBRARY_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v24.0
      - key: TIKTOK_TREND_API_ENDPOINT
        sync: false
      - key: TIKTOK_TREND_API_TOKEN
        sync: false

  - type: cron
    name: arbitra-trend-ingestion
    runtime: node
    plan: starter
    # 06:00 UTC daily. Discovery -> import -> qualify/classify, so the historical
    # trend_candidates dataset actually accumulates instead of only existing when
    # someone runs the scripts by hand.
    schedule: "0 6 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm run ingest:daily
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON
        sync: false
