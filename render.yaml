services:
  - type: web
    name: arbitra-terminal
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BOL_CLIENT_ID
        sync: false
      - key: BOL_CLIENT_SECRET
        sync: false
      - key: AMAZON_CREATORS_API_ENDPOINT
        sync: false
      - key: AMAZON_CREATORS_API_TOKEN
        sync: false
